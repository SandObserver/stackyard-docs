name: Checks

on:
  push:
    branches:
      - main
  pull_request:

# npm install runs dependency code next to the token. This job only reads.
permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: npm

      - name: Install
        run: npm ci

      # sync-widgets.mjs is deliberately not run here. It reads ../stackyard,
      # which is not present on a runner. The copies under public/ are committed.
      - name: Build
        run: npm run build

      - name: Check build output
        run: npm run check
